<script>
// Google Maps / Places: reutilizamos la misma clave que ya funciona en Ruteroide.
const GOOGLE_MAPS_API_KEY = "AIzaSyBYY5lur071mAPKo75CbhLCCfo8yIwXFrc";
let googlePlacesReady = false;
let googlePlacesLoading = null;

// Google Maps llama a esta función mediante callback cuando la API terminó de cargar.
// Es el mismo mecanismo que usa Ruteroide y es más fiable en el WebView de Android.
window.initManosVerdesMaps = function(){
  googlePlacesReady=!!window.google?.maps?.places;
  if(googlePlacesReady){
    document.dispatchEvent(new Event('mvi-google-ready'));
  }
};

function loadGooglePlaces(){
  if(googlePlacesReady && window.google?.maps?.places) return Promise.resolve(true);
  if(googlePlacesLoading) return googlePlacesLoading;

  googlePlacesLoading=new Promise((resolve)=>{
    const finish=(ok)=>{
      googlePlacesReady=!!ok && !!window.google?.maps?.places;
      resolve(googlePlacesReady);
    };

    document.addEventListener('mvi-google-ready',()=>finish(true),{once:true});

    if(window.google?.maps?.places){
      finish(true);
      return;
    }

    const script=document.createElement('script');
    script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&libraries=places,geometry&callback=initManosVerdesMaps';
    script.async=true;
    script.defer=true;
    script.dataset.googleMaps='mvi';
    script.onerror=()=>finish(false);
    document.head.appendChild(script);

    // Si Google rechaza la clave/API, no dejamos la promesa colgada indefinidamente.
    setTimeout(()=>{
      if(!googlePlacesReady) finish(false);
    },10000);
  });
  return googlePlacesLoading;
}

async function setupAddressAutocomplete(existingAddress="", existingLat=null, existingLng=null, existingPlaceId=""){
  const input=document.getElementById('f-address');
  const status=document.getElementById('address-status');
  if(!input) return;

  input.value=existingAddress||'';
  input.dataset.lat=existingLat!=null?existingLat:'';
  input.dataset.lng=existingLng!=null?existingLng:'';
  input.dataset.placeId=existingPlaceId||'';
  document.getElementById('f-address-lat').value=existingLat!=null?existingLat:'';
  document.getElementById('f-address-lng').value=existingLng!=null?existingLng:'';
  document.getElementById('f-address-place-id').value=existingPlaceId||'';

  const ready=await loadGooglePlaces();
  if(!ready){
    status.className='address-status address-warn';
    status.textContent='Google Maps no pudo cargarse. Podés escribir la dirección manualmente.';
    return;
  }

  try{
    const options={
      componentRestrictions:{country:'ar'},
      fields:['formatted_address','geometry','place_id','name']
    };
    const autocomplete=new google.maps.places.Autocomplete(input,options);

    autocomplete.addListener('place_changed',()=>{
      const place=autocomplete.getPlace();
      if(place && place.formatted_address){
        input.value=place.formatted_address;
        input.dataset.lat=place.geometry?.location?.lat?.() ?? '';
        input.dataset.lng=place.geometry?.location?.lng?.() ?? '';
        input.dataset.placeId=place.place_id||'';
        document.getElementById('f-address-lat').value=input.dataset.lat;
        document.getElementById('f-address-lng').value=input.dataset.lng;
        document.getElementById('f-address-place-id').value=input.dataset.placeId;
        status.className='address-status address-ok';
        status.textContent='📍 Dirección confirmada por Google Maps.';
      }else{
        input.dataset.lat='';
        input.dataset.lng='';
        input.dataset.placeId='';
        status.className='address-status address-warn';
        status.textContent='Elegí una sugerencia de Google para guardar la ubicación exacta.';
      }
    });

    input.addEventListener('input',()=>{
      // Si el usuario modifica una dirección después de seleccionarla,
      // ya no conservamos las coordenadas anteriores.
      input.dataset.lat='';
      input.dataset.lng='';
      input.dataset.placeId='';
      document.getElementById('f-address-lat').value='';
      document.getElementById('f-address-lng').value='';
      document.getElementById('f-address-place-id').value='';
      status.className='address-status address-warn';
      status.textContent='Elegí una sugerencia de Google para confirmar la dirección.';
    });

    status.className='address-status '+(existingLat!=null&&existingLng!=null?'address-ok':'address-warn');
    status.textContent=existingLat!=null&&existingLng!=null
      ? '📍 Dirección guardada con ubicación.'
      : 'Escribí y elegí una sugerencia de Google Maps.';
  }catch(err){
    status.className='address-status address-error';
    status.textContent='No se pudo activar la búsqueda de Google Maps. Podés escribir la dirección manualmente.';
  }
}

function preserveOrderForm(){
  const data={};
  const ids=['f-name','f-address','f-phone','f-payment'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el)data[id]=el.value;
  });
  const address=document.getElementById('f-address');
  if(address){
    data['f-address-lat']=address.dataset.lat||'';
    data['f-address-lng']=address.dataset.lng||'';
    data['f-address-place-id']=address.dataset.placeId||'';
  }
  return data;
}

const PRODUCTS_DEFAULT=[
["Bolsón n°1",12000,"n1"],["Bolsón n°2",10000,"n2"],["Bolsón n°3",15000,"n3"],["Bolsón de frutas",10000,"fruta"],
["Miel",8000,"miel"],["Huevos comunes",7000,"hcom"],["Huevos comunes x 2",13000,"hcom2"],["Huevos Caseros",10000,"hcas"],["Huevos Agroecológicos",12000,"hagr"],
["Cremoso Cremac x 2kg",18000,"cc2"],["Cremoso Cremac x 4kg",36000,"cc4"],["Sardo Fresco x 1,5kg",18000,"sf15"],["Sardo Fresco x 3kg",36000,"sf3"],["Sardo Cremac x 1,8kg",36000,"sc18"],
["Promo 1-2-Fruta",31000,"promo12f"],["Promo Los 3 de verdura",35000,"promo3v"],["Promo Los 4 bolsones",45000,"promo4"]];
// La lista de precios es independiente de los pedidos ya guardados.
let PRODUCTS=load("mvi_products",PRODUCTS_DEFAULT.map(p=>[...p]));
if(!Array.isArray(PRODUCTS)||PRODUCTS.length!==PRODUCTS_DEFAULT.length){PRODUCTS=PRODUCTS_DEFAULT.map(p=>[...p]);}
const PROMO_STOCK={promo12f:{n1:1,n2:1,fruta:1},promo3v:{n1:1,n2:1,n3:1},promo4:{n1:1,n2:1,n3:1,fruta:1}};
const PHYSICAL={n1:"Bolsón n°1",n2:"Bolsón n°2",n3:"Bolsón n°3",fruta:"Bolsón de frutas",miel:"Miel",hcom:"Huevos comunes",hcom2:"Huevos comunes x 2",hcas:"Huevos Caseros",hagr:"Huevos Agroecológicos",cc2:"Cremoso Cremac x 2kg",cc4:"Cremoso Cremac x 4kg",sf15:"Sardo Fresco x 1,5kg",sf3:"Sardo Fresco x 3kg",sc18:"Sardo Cremac x 1,8kg"};
let orders=load("mvi_orders",[]), history=load("mvi_history",[]), debts=load("mvi_debts",[]), clients=load("mvi_clients",[]), routeTemplates=load("mvi_route_templates",[]), activeRouteId=load("mvi_active_route",null), page="inicio", cart=[], editing=null, clientPickerFormSnapshot=null;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(){
  localStorage.setItem("mvi_orders",JSON.stringify(orders));
  localStorage.setItem("mvi_history",JSON.stringify(history));
  localStorage.setItem("mvi_debts",JSON.stringify(debts));
  localStorage.setItem("mvi_clients",JSON.stringify(clients));
  localStorage.setItem("mvi_route_templates",JSON.stringify(routeTemplates));
  localStorage.setItem("mvi_active_route",JSON.stringify(activeRouteId));
  localStorage.setItem("mvi_products",JSON.stringify(PRODUCTS));
}
function money(n){return "$"+Number(n||0).toLocaleString("es-AR")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function nav(){
  let a=[
    ["inicio","🏠 Inicio"],
    ["pedidos","🛒 Pedidos"],
    ["ruta","🗺️ Ruta"],
    ["stock","📦 Stock"],
    ["historial","📚 Historial"],
    ["deudas","💳 Deudas"],
    ["backup","💾 Copia"]
  ];
  document.getElementById("nav").innerHTML=a.map(x=>`<button class="${page==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
}
function go(x){page=x;render();scrollTo(0,0)}
function render(){
  nav();
  let m=document.getElementById("main");
  if(page=="inicio")home(m);
  if(page=="pedidos")ordersPage(m);
  if(page=="ruta")routePage(m);
  if(page=="stock")stockPage(m);
  if(page=="historial")historyPage(m);
  if(page=="deudas")debtsPage(m);
  if(page=="backup")backupPage(m);
}
function home(m){
  let p=orders.filter(o=>!o.delivered).length;
  let t=orders.reduce((s,o)=>s+o.total,0);
  let r=routeTemplates.length;

  m.innerHTML=`
    <div class="card">
      <div class="between">
        <div>
          <h2>Reparto actual</h2>
          <div class="muted">Pedidos cargados</div>
        </div>
        <span class="badge">${p} pendientes de entrega</span>
      </div>

      <div class="total">${money(t)}</div>

      <div class="actions">
        <button class="primary" onclick="newOrder()">➕ Nuevo pedido</button>
        <button class="secondary" onclick="go('ruta')">🗺️ Preparar ruta</button>
      </div>
    </div>

    <div class="grid">
      <button class="tile" onclick="go('pedidos')">
        <b>🛒</b><span>Pedidos</span>
      </button>

      <button class="tile" onclick="go('stock')">
        <b>📦</b><span>Stock</span>
      </button>

      <button class="tile" onclick="locationPermission()">
        <b>📍</b><span>Probar ubicación</span>
      </button>

      <button class="tile" onclick="go('historial')">
        <b>📚</b><span>Historial</span>
      </button>

      <button class="tile" onclick="go('ruta')">
        <b>🗺️</b><span>Rutas guardadas: ${r}</span>
      </button>

      <button class="tile" onclick="go('deudas')">
        <b>💳</b><span>Deudas: ${debts.filter(d=>!d.paid).length + orders.filter(o=>String(o.payment||"Pendiente")!=="Pagado").length}</span>
      </button>
    </div>
  `;
}
function ordersPage(m){
  let a=[...orders].sort((x,y)=>String(x.name||"").localeCompare(String(y.name||""),"es",{sensitivity:"base"}));

  m.innerHTML=`
    <div class="between">
      <h2>Pedidos</h2>
      <button class="primary" onclick="newOrder()">➕ Nuevo</button>
    </div>

    ${a.length ? a.map(o=>`
      <div class="card order ${o.delivered ? "order-delivered" : ""}">
        <div class="between">
          <div>
            <b class="order-customer-name">${esc(o.name)}</b>
            <div class="muted">📍 ${esc(o.address)}</div>
          </div>
          <b>${money(o.total)}</b>
        </div>

        <div class="muted order-items" style="margin:7px 0">
          ${o.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(" · ")}
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
          <span class="badge" style="${o.payment==="Pagado" ? "" : "background:#fff3cd;color:#856404"}">
            💰 ${o.payment==="Pagado" ? "Pagado" : "Pago pendiente"}
          </span>

          <span class="badge" style="${o.delivered ? "" : "background:#fff3cd;color:#856404"}">
            🚚 ${o.delivered ? "Entregado" : "Pendiente de entrega"}
          </span>
        </div>

        <div class="actions">
          <button
            class="${o.payment==="Pagado" ? "secondary" : "primary"} small"
            onclick="togglePaid('${o.id}')">
            ${o.payment==="Pagado" ? "↩️ Marcar pendiente" : "💰 Marcar pagado"}
          </button>

          <label style="display:flex;align-items:center;gap:7px;margin:0;padding:7px 10px;border-radius:10px;background:${o.delivered ? "#e4f4e9" : "#fff3cd"};color:${o.delivered ? "var(--g)" : "#856404"};font-size:13px;cursor:pointer">
            <input type="checkbox" style="width:18px;height:18px;margin:0;accent-color:var(--g)" ${o.delivered ? "checked" : ""} onchange="setDelivered('${o.id}', this.checked)">
            🚚 Entregado
          </label>

          <button class="secondary small" onclick="editOrder('${o.id}')">
            ✏️ Editar
          </button>

          ${o.phone ? `<button class="secondary small" onclick="wa('${o.phone}')">💬 WhatsApp</button>` : ""}

          <button
            class="danger small"
            title="Eliminar pedido"
            onclick="deleteOrder('${o.id}')">
            ✕ Eliminar
          </button>
        </div>
      </div>
    `).join("") : `
      <div class="card empty">Todavía no hay pedidos.</div>
    `}

    <div class="card">
      <div class="actions">
        <button class="danger" onclick="deleteAllOrders()">🗑️ Eliminar lista de pedidos</button>
      </div>
      <p class="muted" style="margin-top:10px">Al eliminar la lista, los pedidos con pagos pendientes se conservarán en Deudas.</p>
    </div>
  `;
}

function newOrder(){cart=[];editing=null;openOrder()}
function editOrder(id){editing=orders.find(o=>o.id==id);if(!editing)return;cart=editing.items.map(i=>({...i}));openOrder()}
function openOrder(preserved=null){
  const total=cart.reduce((s,i)=>s+i.qty*i.price,0);
  const saved=preserved || {
    'f-name':editing?.name||'',
    'f-address':editing?.address||'',
    'f-phone':editing?.phone||'',
    'f-payment':editing?.payment||'Pendiente',
    'f-address-lat':editing?.lat ?? '',
    'f-address-lng':editing?.lng ?? '',
    'f-address-place-id':editing?.placeId || ''
  };

  document.getElementById('sheet').innerHTML=`
    <h2>${editing?'Editar pedido':'Nuevo pedido'}</h2>
    <label>Nombre *</label>
    <input id="f-name" value="${esc(saved['f-name']||'')}">

    <label>Dirección *</label>
    <div class="address-wrap">
      <input id="f-address" value="${esc(saved['f-address']||'')}" placeholder="Escribí la dirección y elegí una sugerencia de Google Maps" autocomplete="off">
      <div class="actions" style="margin-top:8px">
        <button type="button" class="secondary small" onclick="saveClientFromForm()">💾 Guardar cliente y dirección</button>
        <button type="button" class="secondary small" onclick="showClientPicker()">👤 Añadir cliente</button>
      </div>

      <input id="f-address-lng" type="hidden" value="${esc(saved['f-address-lng']||'')}">
      <input id="f-address-place-id" type="hidden" value="${esc(saved['f-address-place-id']||'')}">
      <div id="address-status" class="address-status"></div>
    </div>

    <label>Teléfono</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="f-phone" value="${esc(saved['f-phone']||'')}" style="flex:1">
      <button type="button" id="btnPickContact" class="secondary small"
        onclick="pickClientContact()"
        style="white-space:nowrap"
        title="Elegir un contacto de la agenda">
        📱 Agenda
      </button>
    </div>

    <label>Pago</label>
    <select id="f-payment"><option ${saved['f-payment']!='Pagado'?'selected':''}>Pendiente</option><option ${saved['f-payment']=='Pagado'?'selected':''}>Pagado</option></select>

    <h3>Productos</h3>
    ${PRODUCTS.map(p=>{let q=cart.find(i=>i.id==p[2])?.qty||0;return `<div class="product"><div><b>${p[0]}</b><div class="muted">${money(p[1])}</div></div><div class="qty"><button type="button" onclick="changeCart('${p[2]}',-1)">−</button><b>${q}</b><button type="button" onclick="changeCart('${p[2]}',1)">+</button></div></div>`}).join('')}
    <div class="total">Total: ${money(total)}</div>
    <div class="actions"><button type="button" class="primary" onclick="saveOrder()">💾 Guardar pedido</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div>`;

  document.getElementById('modal').classList.add('open');
  setupAddressAutocomplete(
    saved['f-address']||'',
    saved['f-address-lat']!==''?Number(saved['f-address-lat']):null,
    saved['f-address-lng']!==''?Number(saved['f-address-lng']):null,
    saved['f-address-place-id']||''
  );
}

function currentClientFromForm(){
  const name=document.getElementById('f-name')?.value.trim()||'';
  const addressEl=document.getElementById('f-address');
  const address=addressEl?.value.trim()||'';
  const phone=document.getElementById('f-phone')?.value.trim()||'';
  const lat=document.getElementById('f-address-lat')?.value||addressEl?.dataset.lat||'';
  const lng=document.getElementById('f-address-lng')?.value||addressEl?.dataset.lng||'';
  const placeId=document.getElementById('f-address-place-id')?.value||addressEl?.dataset.placeId||'';
  return {
    id:'', name, address, phone,
    lat:lat!==''?Number(lat):null,
    lng:lng!==''?Number(lng):null,
    placeId
  };
}

function saveClientFromForm(){
  const c=currentClientFromForm();
  if(!c.name||!c.address){
    alert('Completá primero el nombre y la dirección del cliente.');
    return;
  }

  const existing=clients.find(x=>
    String(x.name||'').trim().toLowerCase()===c.name.toLowerCase()
  );

  if(existing){
    if(!confirm(`Ya existe un cliente llamado "${existing.name}". ¿Querés actualizar sus datos?`)) return;
    existing.address=c.address;
    existing.phone=c.phone;
    existing.lat=c.lat;
    existing.lng=c.lng;
    existing.placeId=c.placeId;
  }else{

function changeCart(id,d){
  const form=preserveOrderForm();
  const p=PRODUCTS.find(x=>x[2]==id),i=cart.findIndex(x=>x.id==id);
  if(i<0&&d>0)cart.push({id:p[2],name:p[0],price:p[1],qty:1});
  else if(i>=0){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1)}

function saveOrder(){
  const name=document.getElementById('f-name')?.value.trim()||'';
  const addressEl=document.getElementById('f-address');
  const address=addressEl?.value.trim()||'';

  if(!name||!address||!cart.length){
    alert('Completá nombre, dirección y al menos un producto.');
    return;
  }

  const lat=document.getElementById('f-address-lat')?.value||addressEl?.dataset.lat||'';
  const lng=document.getElementById('f-address-lng')?.value||addressEl?.dataset.lng||'';
  const placeId=document.getElementById('f-address-place-id')?.value||addressEl?.dataset.placeId||'';

  const wasEditing=!!editing;

  const o={
    id:editing?.id||Date.now().toString(),
    name,
    address,
    phone:document.getElementById('f-phone')?.value.trim()||'',
    payment:document.getElementById('f-payment')?.value||'Pendiente',
    lat:lat!==''?Number(lat):null,
    lng:lng!==''?Number(lng):null,
    placeId,
    items:cart.map(i=>({...i})),
    total:cart.reduce((s,i)=>s+i.qty*i.price,0),
    delivered:editing?.delivered||false
  };

  if(wasEditing){
    orders[orders.findIndex(x=>x.id==editing.id)]=o;
  }else{
    orders.push(o);
  }

  save();

  if(wasEditing){
    closeModal();
    go('pedidos');
    return;
  }

  cart=[];
  editing=null;
  openOrder();
}

function deleteOrder(id){
  const o=orders.find(x=>x.id==id);
  if(!o)return;

  if(!confirm(`¿Deseás eliminar el pedido de ${o.name}?`)) return;

  orders=orders.filter(x=>x.id!==id);

  // También lo quitamos de las rutas guardadas para evitar paradas fantasma.
  routeTemplates.forEach(r=>{
    r.stops=(r.stops||[]).filter(s=>{
      if(s.orderId) return s.orderId!==id;
      return !(String(s.name||"").toLowerCase()===String(o.name||"").toLowerCase() &&
               String(s.address||"").toLowerCase()===String(o.address||"").toLowerCase());
    });
    if(r.optimizedOrderIds) {
      r.optimizedOrderIds=r.optimizedOrderIds.filter(x=>x!==id);
    }
  });

  save();
  render();
}
function deleteAllOrders(){
  if(!orders.length){alert("No hay pedidos para eliminar.");return;}
  const unpaid=orders.filter(o=>String(o.payment||"Pendiente")!=="Pagado");
  const message="¿Eliminar la lista completa de pedidos?\n\nSe eliminarán "+orders.length+" pedidos. Esta acción no se puede deshacer.\n"+
    (unpaid.length ? unpaid.length+" pedidos con pagos pendientes se conservarán en el apartado Deudas.\n" : "")+
    "Los clientes guardados y el historial no se eliminarán.";
  if(!confirm(message))return;
  for(const order of unpaid){
    if(debts.some(d=>String(d.sourceOrderId||"")===String(order.id)))continue;
    debts.push({id:"debt-"+String(order.id),sourceOrderId:order.id,name:order.name||"Cliente",address:order.address||"",phone:order.phone||"",amount:Number(order.total||0),note:"Pedido pendiente de pago",date:new Date().toISOString(),paid:false});
  }
  const removedIds=new Set(orders.map(o=>String(o.id)));
  routeTemplates.forEach(route=>{
    route.stops=(route.stops||[]).filter(stop=>{
      const id=String(stop.orderId??stop.customId??stop.id??"");
      return !removedIds.has(id)||id.startsWith("custom-");
    });
    route.optimizedOrderIds=(route.optimizedOrderIds||[]).filter(id=>!removedIds.has(String(id)));
    route.optimizedAt=null;
  });
  orders=[];
  save();render();
  alert("Lista eliminada. Se conservaron los clientes, las rutas guardadas y el historial; los pagos pendientes siguen en Deudas.");
}

function saveProductPrice(id){
  const p=PRODUCTS.find(x=>x[2]===id), input=document.getElementById('price-'+id);
  if(!p||!input)return;
  const value=Math.round(Number(input.value||0));
  if(!Number.isFinite(value)||value<0){alert('Ingresá un precio válido.');return;}
  p[1]=value; save(); alert(`${p[0]}: nuevo precio ${money(value)}.`); stockPage(document.getElementById('main'));
}
function adjustAllPrices(){
  const raw=prompt('¿Qué porcentaje querés aplicar a TODOS los precios? Ej.: 10 para aumentar 10% o -10 para bajar 10%.');
  if(raw===null)return;
  const pct=Number(String(raw).replace(',','.'));
  if(!Number.isFinite(pct)||pct<=-100){alert('Ingresá un porcentaje válido mayor a -100%.');return;}
  if(!confirm(`Se aplicará ${pct>0?'+':''}${pct}% a todos los precios. ¿Continuar?`))return;
  PRODUCTS.forEach(p=>p[1]=Math.round(Number(p[1]||0)*(1+pct/100)/100)*100);
  save(); stockPage(document.getElementById('main'));
}
function resetPrices(){
  if(!confirm('¿Restaurar todos los precios iniciales? Los pedidos existentes NO cambiarán.'))return;
  PRODUCTS=PRODUCTS_DEFAULT.map(p=>[...p]); save(); stockPage(document.getElementById('main'));
}

            <button class="secondary small" onclick="loadRoute('${r.id}')">Cargar</button>
            <button class="secondary small" onclick="overwriteRoute('${r.id}')">💾 Vaciar para seleccionar de nuevo</button>
            <button class="danger small" onclick="deleteRoute('${r.id}')">🗑️ Eliminar</button>
          </div>
        </div>`).join("")
        : `<div class="empty">Todavía no hay rutas guardadas.</div>`}
    </div>
  `;

  if(active){
    setupRouteAutocomplete("route-origin","route-origin-status",active.start?.label||active.origin||"");
    setupRouteAutocomplete("route-destination","route-destination-status",active.end?.label||active.destination||"");
  }else{
    setupRouteAutocomplete("route-new-origin","route-new-origin-status","");
    setupRouteAutocomplete("route-new-destination","route-new-destination-status","");
  }
}


async function setupRouteAutocomplete(inputId,statusId,existingValue=""){
  const input=document.getElementById(inputId);
  const status=document.getElementById(statusId);
  if(!input||!status)return;

  input.value=existingValue||"";
  input.dataset.lat="";
  input.dataset.lng="";

  const ready=await loadGooglePlaces();

  if(!ready){
    status.className="address-status address-warn";
    status.textContent="Google Maps no pudo cargarse. Podés escribir la dirección manualmente.";
    return;
  }

  try{
    const autocomplete=new google.maps.places.Autocomplete(
      input,
      {
        componentRestrictions:{country:"ar"},
        fields:["formatted_address","geometry","place_id","name"]
      }
    );

    autocomplete.addListener("place_changed",()=>{
      const place=autocomplete.getPlace();

      if(place && place.formatted_address){
        input.value=place.formatted_address;
        input.dataset.lat=place.geometry?.location?.lat?.() ?? "";
        input.dataset.lng=place.geometry?.location?.lng?.() ?? "";
        input.dataset.placeId=place.place_id||"";

        status.className="address-status address-ok";
        status.textContent="📍 Dirección confirmada por Google Maps.";
      }else{
        input.dataset.lat="";
        input.dataset.lng="";
        input.dataset.placeId="";
        status.className="address-status address-warn";
        status.textContent="Elegí una sugerencia de Google Maps.";
      }
    });

    status.className="address-status address-warn";
    status.textContent=existingValue
      ? "📍 Dirección guardada. Podés modificarla."
      : "Escribí y elegí una dirección de Google Maps.";

  }catch(error){
    console.error("Route autocomplete:",error);
    status.className="address-status address-warn";
    status.textContent="Podés escribir la dirección manualmente.";
  }
}

function routeStopsForActiveRoute(){
  const route=routeTemplates.find(r=>r.id===activeRouteId);
  if(!route)return [];

  const pending=orders.filter(o=>!o.delivered);
  const savedIds=new Set(
    (route.stops||[]).map(s=>String(s.orderId)).filter(Boolean)
  );

  return pending.filter(o=>savedIds.has(String(o.id)));
}

function createRouteFromPage(){
  const name=document.getElementById("route-new-name")?.value.trim()||"";
  const origin=document.getElementById("route-new-origin")?.value.trim()||"";
  const destination=document.getElementById("route-new-destination")?.value.trim()||"";

  if(!name||!origin||!destination){
    alert("Completá nombre, dirección inicial y punto de llegada.");
    return;
  }

  let route=routeTemplates.find(r=>String(r.name||"").toLowerCase()===name.toLowerCase());

  if(route){
    if(!confirm(`Ya existe la ruta "${route.name}". ¿Sobrescribirla?`)) return;
  }else{
    route={id:"r"+Date.now(),name,stops:[]};
    routeTemplates.push(route);
  }

  route.name=name;
  route.origin=origin;
  route.destination=destination;
  route.start={label:origin};
  route.end={label:destination};
  route.stops=[];
  route.optimizedOrderIds=[];
  route.optimizedAt=null;

function addSelectedOrdersToActiveRoute(){
  const route=routeTemplates.find(r=>r.id===activeRouteId);

  if(!route){
    alert("Primero creá y guardá la ruta con su nombre, inicio y llegada.");
    return;
  }

  const checks=[...document.querySelectorAll(".route-order-check:checked")];

  if(!checks.length){
    alert("Seleccioná al menos un pedido de la lista.");
    return;
  }

  route.stops=route.stops||[];

  const existing=new Set(
    route.stops.map(s=>String(s.orderId))
  );

  let added=0;

  for(const check of checks){
    const order=orders.find(
      o=>String(o.id)===String(check.value)
    );

    if(!order||order.delivered){
      continue;
    }

    if(existing.has(String(order.id))){
      continue;
    }

    route.stops.push({
      orderId:order.id,
      name:order.name,
      address:order.address,
      phone:order.phone||"",
      lat:order.lat??null,
      lng:order.lng??null,
      placeId:order.placeId||""
    });

    existing.add(String(order.id));
    added++;
  }

  route.optimizedOrderIds=[];
  route.optimizedAt=null;

  save();
  render();

  if(added===0){
    alert("Los pedidos seleccionados ya forman parte de esta ruta.");
  }else{
    alert(
      `${added} pedido${added===1?"":"s"} agregado${added===1?"":"s"} a la ruta.`
    );
  }
}

function removeOrderFromActiveRoute(id){
  const route=routeTemplates.find(r=>r.id===activeRouteId);
  if(!route)return;

  const order=orders.find(o=>String(o.id)===String(id));

  if(!confirm(`¿Quitar a ${order?.name||"este cliente"} de esta ruta?\n\nNo se eliminará el cliente ni el pedido de la aplicación; solo se quitará de esta ruta.`)) return;

  route.stops=(route.stops||[]).filter(s=>String(s.orderId)!==String(id));
  route.optimizedOrderIds=(route.optimizedOrderIds||[]).filter(x=>String(x)!==String(id));
  route.optimizedAt=null;

  save();
  render();
}

function renderOptimizedRouteMap(result,optimized,origin,destination){
  const box=document.getElementById("route-optimized-result");
  const mapDiv=document.getElementById("route-optimized-map");
  const metrics=document.getElementById("route-optimized-metrics");
  const list=document.getElementById("route-optimized-list");

  if(!box||!mapDiv||!window.google?.maps||!result?.routes?.[0]){
    console.warn("No se pudo preparar el mapa de la ruta.");
    return;
  }

  box.style.display="block";
  mapDiv.style.display="block";
  mapDiv.style.width="100%";
  mapDiv.style.height="320px";
  mapDiv.style.minHeight="320px";

  const route=result.routes[0];
  const bounds=new google.maps.LatLngBounds();

  if(route.overview_path){
    route.overview_path.forEach(point=>bounds.extend(point));
  }

  // Esperamos a que el navegador pinte el contenedor antes de crear el mapa.
  // Esto evita el problema típico de mapas que aparecen en blanco dentro de
  // una pantalla que acaba de ser renderizada.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      try{
        mapDiv.innerHTML="";

        const map=new google.maps.Map(mapDiv,{
          zoom:12,
          center:route.overview_path?.[0]||{lat:-34.87,lng:-57.88},
          mapTypeControl:false,
          streetViewControl:false,
          fullscreenControl:true,
          gestureHandling:"greedy"
        });

        const renderer=new google.maps.DirectionsRenderer({
          map,
          directions:result,
          routeIndex:0,
          suppressMarkers:false,
          preserveViewport:false,
          polylineOptions:{
            strokeColor:"#176b3a",
            strokeWeight:5,
            strokeOpacity:.9
          }
        });

        window.__manosVerdesRouteRenderer=renderer;
        window.__manosVerdesRouteMap=map;

        if(!bounds.isEmpty()){
          map.fitBounds(bounds);
        }

        setTimeout(()=>{
          google.maps.event.trigger(map,"resize");
          if(!bounds.isEmpty()) map.fitBounds(bounds);
        },100);

      }catch(error){
        console.error("Error dibujando mapa:",error);
      }
    });
  });

  let totalDistance=0;
  let totalDuration=0;

  route.legs.forEach(leg=>{
    totalDistance+=leg.distance?.value||0;
    totalDuration+=leg.duration?.value||0;
  });

  if(metrics){
    metrics.innerHTML=
      `<b>📏 ${(totalDistance/1000).toFixed(1)} km</b>
       · ⏱️ ${Math.round(totalDuration/60)} min aprox.
       · 📦 ${optimized.length} paradas`;
  }

  if(list){
    let html=`
      <div style="padding:10px;border-radius:10px;background:#f3f7f4;margin-bottom:8px">
        <b>🟢 INICIO</b><br>
        <small>${esc(origin)}</small>
      </div>
    `;

    optimized.forEach((order,i)=>{
      const leg=route.legs[i];
      const previous=i===0 ? origin : optimized[i-1].address;

      const mapsUrl=
        "https://www.google.com/maps/dir/?api=1"+
        "&origin="+encodeURIComponent(previous)+
        "&destination="+encodeURIComponent(order.address)+
        "&travelmode=driving";

      html+=`
        <div class="route-stop-result">
          <div class="route-stop-info">
            <b>${i+1}. ${esc(order.name)}</b><br>
            <small>📍 ${esc(order.address)}</small>
            ${leg?.distance?.text
              ? `<br><small class="muted">Tramo: ${leg.distance.text} · ${leg.duration?.text||""}</small>`
              : ""}
          </div>

          <div class="route-stop-gps">
            <button
              type="button"
              class="secondary small"
              onclick="openRouteStopInGoogleMaps('${encodeURIComponent(mapsUrl)}')">
              🗺️ Ir
            </button>
          </div>
        </div>
      `;
    });

    const lastLeg=route.legs[route.legs.length-1];

    const fullUrl=
      "https://www.google.com/maps/dir/?api=1"+
      "&origin="+encodeURIComponent(origin)+
      "&destination="+encodeURIComponent(destination)+
      "&waypoints="+optimized.map(o=>encodeURIComponent(o.address)).join("|")+
      "&travelmode=driving";

    html+=`
      <div style="padding:10px;border-radius:10px;background:#f3f7f4;margin-top:8px">
        <b>🏁 LLEGADA</b><br>
        <small>${esc(destination)}</small>
        ${lastLeg?.distance?.text
          ? `<br><small class="muted">Tramo final: ${lastLeg.distance.text} · ${lastLeg.duration?.text||""}</small>`
          : ""}
      </div>

      <div class="actions" style="margin-top:10px">
        <button
          type="button"
          class="primary"
          onclick="openRouteStopInGoogleMaps('${encodeURIComponent(fullUrl)}')">
          🗺️ Abrir recorrido completo en Google Maps
        </button>
      </div>
    `;

    list.innerHTML=html;
  }

  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function openRouteStopInGoogleMaps(encodedUrl){
  try{
    const url=decodeURIComponent(encodedUrl);
    window.open(url,"_blank");
  }catch(error){
    console.error("Google Maps:",error);
  }
}

async function optimizeActiveRoute(){
  const route=routeTemplates.find(r=>r.id===activeRouteId);

  if(!route){
    alert("Primero creá o cargá una ruta.");
    return;
  }

  const routeOrders=routeStopsForActiveRoute();

  if(!routeOrders.length){
    alert("No hay pedidos pendientes para optimizar.");
    return;
  }

  const origin=document.getElementById("route-origin")?.value.trim()
    || route.start?.label
    || route.origin
    || "";

  const destination=document.getElementById("route-destination")?.value.trim()
    || route.end?.label
    || route.destination
    || "";

  if(!origin||!destination){
    alert("Completá la dirección inicial y el punto de llegada antes de optimizar.");
    return;
  }

  if(routeOrders.length===1){
    route.origin=origin;
    route.destination=destination;
    route.start={label:origin};
    route.end={label:destination};
    route.stops=routeOrders.map(o=>({
      orderId:o.id,
      name:o.name,
      address:o.address,
      phone:o.phone||"",
      lat:o.lat??null,
      lng:o.lng??null,
      placeId:o.placeId||""
    }));
    route.optimizedOrderIds=[routeOrders[0].id];
    route.optimizedAt=new Date().toISOString();
    save();
    render();

    try{
      const service=new google.maps.DirectionsService();
      const result=await new Promise((resolve,reject)=>{
        service.route({
          origin,
          destination,
          waypoints:[{
            location:routeOrders[0].lat!=null&&routeOrders[0].lng!=null
              ? {lat:Number(routeOrders[0].lat),lng:Number(routeOrders[0].lng)}
              : routeOrders[0].address,
            stopover:true
          }],
          optimizeWaypoints:true,
          travelMode:google.maps.TravelMode.DRIVING
        },(response,status)=>{
          if(status==="OK")resolve(response);
          else reject(new Error(status));
        });
      });
      renderOptimizedRouteMap(result,routeOrders,origin,destination);
    }catch(e){
      console.warn("No se pudo dibujar el mapa:",e);
    }

    alert("Hay una sola parada: la ruta quedó lista.");
    return;
  }

  const ready=await loadGooglePlaces();

  if(!ready || !window.google?.maps?.DirectionsService){
    alert("Google Maps no está disponible para optimizar la ruta.");
    return;
  }

  try{
    const service=new google.maps.DirectionsService();

    const waypoints=routeOrders.map(o=>({
      location:o.lat!=null && o.lng!=null
        ? {lat:Number(o.lat),lng:Number(o.lng)}
        : o.address,
      stopover:true
    }));

    const result=await new Promise((resolve,reject)=>{
      service.route({
        origin,
        destination,
        waypoints,
        optimizeWaypoints:true,
        travelMode:google.maps.TravelMode.DRIVING
      },(response,status)=>{
        if(status==="OK")resolve(response);
        else reject(new Error(status||"No se pudo calcular la ruta."));
      });
    });

    const order=result.routes?.[0]?.waypoint_order;

    if(!Array.isArray(order)||order.length!==routeOrders.length){
      throw new Error("Google Maps no devolvió un orden optimizado.");
    }

    const optimized=order.map(i=>routeOrders[i]).filter(Boolean);

    route.origin=origin;
    route.destination=destination;
    route.start={label:origin};
    route.end={label:destination};

    route.stops=optimized.map(o=>({
      orderId:o.id,
      name:o.name,
      address:o.address,
      phone:o.phone||"",
      lat:o.lat??null,
      lng:o.lng??null,
      placeId:o.placeId||""
    }));

    route.optimizedOrderIds=optimized.map(o=>o.id);
    route.optimizedAt=new Date().toISOString();

    save();
    render();

    renderOptimizedRouteMap(result,optimized,origin,destination);

    alert(
      `Ruta optimizada correctamente: ${optimized.length} paradas.`
    );

  }catch(error){
    console.error("Optimización:",error);
    alert(
      "No se pudo optimizar la ruta. Revisá las direcciones inicial y final y que los pedidos tengan una dirección válida."
    );
  }
}

  save();
  render();

  alert("Ruta vaciada. Ahora seleccioná los pedidos que querés agregar.");
}


function clearActiveRoute(){
  activeRouteId=null;
  save();
  render();
}

function deleteRoute(id){
  const route=routeTemplates.find(r=>r.id===id);

  if(!route)return;

  if(!confirm(`¿Eliminar la ruta "${route.name}"?`)){
    return;
  }

  routeTemplates=routeTemplates.filter(r=>r.id!==id);

  if(activeRouteId===id){
    activeRouteId=null;
  }

  save();
  render();
}

function historyPage(m){
    m.innerHTML = `
        <h2>Historial</h2>
        ${history.length ? history.map((h,i) => `
            <div class="card">
                <div class="between">
                    <b>Reparto ${new Date(h.date).toLocaleDateString("es-AR")}</b>
                    <b>${money(h.total)}</b>
                </div>
                <div class="muted">
                    ${h.orders.length} pedidos · ${h.delivered} entregados
                </div>
                <button class="danger small" style="margin-top:10px" onclick="deleteHistory(${i})">
                    🗑️ Eliminar
                </button>
            </div>
        `).join("") : `
            <div class="card empty">
                Todavía no hay repartos finalizados.
            </div>
        `}
    `;
}
function deleteHistory(i){if(confirm("¿Eliminar este reparto?")){history.splice(i,1);save();render()}}
function closeModal(){document.getElementById("modal").classList.remove("open")}
render();
</script>

<script>
(function () {
  function setPhone(value) {
    if (!value) return;
    const input = document.getElementById('f-phone');
    if (!input) return;
    input.value = String(value).trim();
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.dispatchEvent(new Event('change', {bubbles:true}));
  }

  window.pickClientContact = async function () {
    try {
      if (window.RuteroideContacts &&
          typeof window.RuteroideContacts.pickContact === 'function') {
        const result = await window.RuteroideContacts.pickContact();
        const phone = result?.phone || result?.number || result?.tel || '';
        if (phone) {
          setPhone(phone);
          return;
        }
        alert('El contacto seleccionado no tiene un número de teléfono.');
        return;
      }

      if (navigator.contacts &&
          typeof navigator.contacts.select === 'function') {
        const contacts = await navigator.contacts.select(
          ['name', 'tel'],
          {multiple:false}

        if (contacts && contacts.length) {
          const phones = contacts[0].tel || [];
          if (phones.length) {
            setPhone(phones[0]);
            return;
          }
          alert('Ese contacto no tiene un número de teléfono guardado.');

      alert(e?.message || 'No se pudo abrir la agenda de Android.');

  };
})();

<script>
/* MANOS_VERDES_BACKUP_MERGE_CLIENTS_V1 */
function backupPage(m){
  m.innerHTML = `
    <div class="card">
      <h2>💾 Copia de seguridad</h2>
      <p class="muted">Exportá todos los datos de esta aplicación o cargá una copia anterior.</p>
      <div class="actions">
        <button class="primary" type="button" onclick="exportManosVerdesBackup()">⬇️ Crear copia de seguridad</button>
        <button class="secondary" type="button" onclick="document.getElementById('mv-backup-file').click()">📂 Cargar copia de seguridad</button>
      </div>
      <input id="mv-backup-file" type="file" accept=".json,application/json" style="display:none" onchange="importManosVerdesBackup(this)">
      <p class="muted" style="margin-top:12px">Al cargar una copia, el resto de los datos se restaurará desde ella. Los clientes se combinarán: se conservan los que ya existen, se omiten los repetidos y se agregan los que falten.</p>
    </div>
    <div class="card">
      <h3>Cómo se combinan los clientes</h3>
      <ul>
        <li>Los clientes actuales nunca se borran al restaurar.</li>
        <li>Si un cliente ya existe con el mismo nombre y dirección, no se duplica.</li>
        <li>Los clientes nuevos de la copia se suman a la base actual.</li>
      </ul>
      <p class="muted">Consejo: guardá una copia antes de restaurar datos importantes.</p>
    </div>
  `;
}

async function exportManosVerdesBackup(){
  const button = document.querySelector('button[onclick="exportManosVerdesBackup()"]');
  if(button){button.disabled=true;button.textContent="⏳ Preparando copia...";}
  try{
    const keys = ["mvi_orders","mvi_history","mvi_debts","mvi_clients","mvi_route_templates","mvi_active_route","mvi_products"];
    const storage = {};
    for(const key of keys){
      const value = localStorage.getItem(key);
      if(value !== null) storage[key] = value;
    }
    const backup = {version:1, app:"Manos Verdes Full", createdAt:new Date().toISOString(), storage};
    const content = JSON.stringify(backup,null,2);
    const filename = "Manos-Verdes-Backup-" + new Date().toISOString().slice(0,10) + ".json";

    // En Android/Capacitor, usar el selector nativo para que el usuario elija
    // dónde guardar el archivo; las descargas Blob no funcionan de forma fiable en WebView.
    if(window.ManosVerdesBackup && typeof window.ManosVerdesBackup.saveBackup === "function"){
      const result = await window.ManosVerdesBackup.saveBackup({filename,content});
      if(result?.cancelled) return;
      alert("¡Copia de seguridad guardada correctamente!\n\nArchivo: "+filename+"\n\nPodés encontrarla en la ubicación que elegiste.");
      return;
    }

    // Respaldo para cuando la aplicación se abre en un navegador normal.
    const blob = new Blob([content],{type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    alert("Se solicitó la descarga de la copia de seguridad. Revisá las descargas del navegador.");
  }catch(error){
    console.error("Crear copia de seguridad:",error);
    alert("No se pudo crear la copia de seguridad.\n\n"+(error?.message||"Intentá nuevamente."));
  }finally{
    if(button){button.disabled=false;button.textContent="⬇️ Crear copia de seguridad";}
  }
}

function normalizeBackupText(value){
  return String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ").toLocaleLowerCase("es");
}
function backupClientKey(client){
  const name = normalizeBackupText(client?.name);
  const address = normalizeBackupText(client?.address);
  const phone = normalizeBackupText(client?.phone);
  if(!name) return "id:" + String(client?.id ?? "");
  if(address) return "name-address:" + name + "|" + address;
  if(phone) return "name-phone:" + name + "|" + phone;
  return "name:" + name;
}
async function importManosVerdesBackup(input){
  const file = input?.files?.[0];
  if(!file) return;
  input.value = "";
  try{
    const backup = JSON.parse(await file.text());
    const storage = backup?.storage;
    if(!storage || typeof storage !== "object" || Array.isArray(storage)){
      throw new Error("El archivo no tiene el formato de una copia de seguridad compatible.");
    }
    if(backup.app && !String(backup.app).toLowerCase().includes("manos verdes")){
      if(!confirm("El archivo no identifica a Manos Verdes Full. ¿Querés intentar cargarlo igualmente?")) return;
    }
    const incomingRaw = storage.mvi_clients;
    let incomingClients = [];
    if(incomingRaw != null){
      incomingClients = Array.isArray(incomingRaw) ? incomingRaw : JSON.parse(incomingRaw);
      if(!Array.isArray(incomingClients)) throw new Error("La lista de clientes de la copia no es válida.");
    }
    const currentClients = load("mvi_clients",[]);
    if(!Array.isArray(currentClients)) throw new Error("La base actual de clientes no es válida.");
    const merged = currentClients.map(c=>({...c}));
    const known = new Set(merged.map(backupClientKey));
    let added = 0, duplicates = 0;
    const usedIds = new Set(merged.map(c=>String(c?.id ?? "")).filter(Boolean));
    for(const rawClient of incomingClients){
      if(!rawClient || typeof rawClient !== "object" || Array.isArray(rawClient)) continue;
      const key = backupClientKey(rawClient);
      if(known.has(key)){
        duplicates++;
        continue;
      }
      const client = {...rawClient};
      if(!client.id || usedIds.has(String(client.id))){
        let id;
        do { id = "c" + Date.now().toString() + Math.random().toString(36).slice(2,7); }
        while(usedIds.has(id));
        client.id = id;
      }
      usedIds.add(String(client.id));
      known.add(key);
      merged.push(client);
      added++;
    }
    const previousCount = currentClients.length;
    // Restore all supported app data from the backup, but merge rather than replace clients.
    for(const [key,value] of Object.entries(storage)){
      if(typeof key !== "string" || !key.startsWith("mvi_") || key === "mvi_clients") continue;
      localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    }
    localStorage.setItem("mvi_clients",JSON.stringify(merged));
    orders = load("mvi_orders",[]);
    history = load("mvi_history",[]);
    debts = load("mvi_debts",[]);
    clients = load("mvi_clients",[]);
    routeTemplates = load("mvi_route_templates",[]);
    activeRouteId = load("mvi_active_route",null);
    const restoredProducts = load("mvi_products",PRODUCTS_DEFAULT.map(p=>[...p]));
    if(Array.isArray(restoredProducts) && restoredProducts.length === PRODUCTS_DEFAULT.length) PRODUCTS = restoredProducts;
    save();
    render();
    alert("Copia cargada correctamente.\n\nClientes que ya había: " + previousCount +
      "\nClientes agregados: " + added +
      "\nRepetidos omitidos: " + duplicates +
      "\nTotal de clientes ahora: " + merged.length +
      "\n\nLos clientes anteriores se conservaron.");
  }catch(error){
    console.error("Carga de copia de seguridad:",error);
    alert(error?.message || "No se pudo cargar la copia de seguridad. No se modificaron los datos.");
  }
}
</script>
