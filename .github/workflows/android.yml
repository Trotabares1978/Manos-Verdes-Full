name: Build Manos Verdes Full
on:
  push:
    branches: [clean-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar entorno
        run: |
          node --version
          npm --version
          java -version
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Validar y preparar interfaz
        run: npm run build:web
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Aplicar icono agroecológico y nombre de la app
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -background none web/icon.svg -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert -background none web/icon.svg -resize "${size}x${size}" "$dir/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable
          convert -background none web/icon.svg -resize 432x432 android/app/src/main/res/drawable/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#176b3a</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Forzar icono bitmap en todos los lanzadores Android
        run: |
          # Evitar que un adaptive icon heredado de Capacitor tape el PNG personalizado.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert web/icon.svg -background "#176b3a" -alpha remove -alpha off -resize "${size}x${size}!" "$dir/ic_launcher.png"
            convert web/icon.svg -background "#176b3a" -alpha remove -alpha off -resize "${size}x${size}!" "$dir/ic_launcher_round.png"
          done
          # Comprobar que existen los recursos usados por el manifiesto.
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK de depuración
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Manos-Verdes-Full-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
