<script>
// Google Maps / Places: reutilizamos la misma clave que ya funciona en Ruteroide.
const GOOGLE_MAPS_API_KEY = "AIzaSyBYY5lur071mAPKo75CbhLCCfo8yIwXFrc";
let googlePlacesReady = false;
let googlePlacesLoading = null;

// Google Maps llama a esta función mediante callback cuando la API terminó de cargar.
// Es el mismo mecanismo que usa Ruteroide y es más fiable en el WebView de Android.
window.initManosVerdesMaps = function(){
  googlePlacesReady=!!window.google?.maps?.places;
  if(googlePlacesReady){
    document.dispatchEvent(new Event('mvi-google-ready'));
  }
};

function loadGooglePlaces(){
  if(googlePlacesReady && window.google?.maps?.places) return Promise.resolve(true);
  if(googlePlacesLoading) return googlePlacesLoading;

  googlePlacesLoading=new Promise((resolve)=>{
    const finish=(ok)=>{
      googlePlacesReady=!!ok && !!window.google?.maps?.places;
      resolve(googlePlacesReady);
    };

    document.addEventListener('mvi-google-ready',()=>finish(true),{once:true});

    if(window.google?.maps?.places){
      finish(true);
      return;
    }

    const script=document.createElement('script');
    script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&libraries=places,geometry&callback=initManosVerdesMaps';
    script.async=true;
    script.defer=true;
    script.dataset.googleMaps='mvi';
    script.onerror=()=>finish(false);
    document.head.appendChild(script);

    // Si Google rechaza la clave/API, no dejamos la promesa colgada indefinidamente.
    setTimeout(()=>{
      if(!googlePlacesReady) finish(false);
    },10000);
  });
  return googlePlacesLoading;
}

async function setupAddressAutocomplete(existingAddress="", existingLat=null, existingLng=null, existingPlaceId=""){
  const input=document.getElementById('f-address');
  const status=document.getElementById('address-status');
  if(!input) return;

  input.value=existingAddress||'';
  input.dataset.lat=existingLat!=null?existingLat:'';
  input.dataset.lng=existingLng!=null?existingLng:'';
  input.dataset.placeId=existingPlaceId||'';
  document.getElementById('f-address-lat').value=existingLat!=null?existingLat:'';
  document.getElementById('f-address-lng').value=existingLng!=null?existingLng:'';
  document.getElementById('f-address-place-id').value=existingPlaceId||'';

  const ready=await loadGooglePlaces();
  if(!ready){
    status.className='address-status address-warn';
    status.textContent='Google Maps no pudo cargarse. Podés escribir la dirección manualmente.';
    return;
  }

  try{
    const options={
      componentRestrictions:{country:'ar'},
      fields:['formatted_address','geometry','place_id','name']
    };
    const autocomplete=new google.maps.places.Autocomplete(input,options);

    autocomplete.addListener('place_changed',()=>{
      const place=autocomplete.getPlace();
      if(place && place.formatted_address){
        input.value=place.formatted_address;
        input.dataset.lat=place.geometry?.location?.lat?.() ?? '';
        input.dataset.lng=place.geometry?.location?.lng?.() ?? '';
        input.dataset.placeId=place.place_id||'';
        document.getElementById('f-address-lat').value=input.dataset.lat;
        document.getElementById('f-address-lng').value=input.dataset.lng;
        document.getElementById('f-address-place-id').value=input.dataset.placeId;
        status.className='address-status address-ok';
        status.textContent='📍 Dirección confirmada por Google Maps.';
      }else{
        input.dataset.lat='';
        input.dataset.lng='';
        input.dataset.placeId='';
        status.className='address-status address-warn';
        status.textContent='Elegí una sugerencia de Google para guardar la ubicación exacta.';
      }
    });

    input.addEventListener('input',()=>{
      // Si el usuario modifica una dirección después de seleccionarla,
      // ya no conservamos las coordenadas anteriores.
      input.dataset.lat='';
      input.dataset.lng='';
      input.dataset.placeId='';
      document.getElementById('f-address-lat').value='';
      document.getElementById('f-address-lng').value='';
      document.getElementById('f-address-place-id').value='';
      status.className='address-status address-warn';
      status.textContent='Elegí una sugerencia de Google para confirmar la dirección.';
    });

    status.className='address-status '+(existingLat!=null&&existingLng!=null?'address-ok':'address-warn');
    status.textContent=existingLat!=null&&existingLng!=null
      ? '📍 Dirección guardada con ubicación.'
      : 'Escribí y elegí una sugerencia de Google Maps.';
  }catch(err){
    status.className='address-status address-error';
    status.textContent='No se pudo activar la búsqueda de Google Maps. Podés escribir la dirección manualmente.';
  }
}

function preserveOrderForm(){
  const data={};
  const ids=['f-name','f-address','f-phone','f-payment'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el)data[id]=el.value;
  });
  const address=document.getElementById('f-address');
  if(address){
    data['f-address-lat']=address.dataset.lat||'';
    data['f-address-lng']=address.dataset.lng||'';
    data['f-address-place-id']=address.dataset.placeId||'';
  }
  return data;
}

["Promo 1-2-Fruta",31000,"promo12f"],["Promo Los 3 de verdura",35000,"promo3v"],["Promo Los 4 bolsones",45000,"promo4"]];

let orders=load("mvi_orders",[]), history=load("mvi_history",[]), debts=load("mvi_debts",[]), clients=load("mvi_clients",[]), routeTemplates=load("mvi_route_templates",[]), activeRouteId=load("mvi_active_route",null), page="inicio", cart=[], editing=null;
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(){
  localStorage.setItem("mvi_orders",JSON.stringify(orders));
  localStorage.setItem("mvi_history",JSON.stringify(history));
  localStorage.setItem("mvi_debts",JSON.stringify(debts));
  localStorage.setItem("mvi_clients",JSON.stringify(clients));
  localStorage.setItem("mvi_route_templates",JSON.stringify(routeTemplates));
  localStorage.setItem("mvi_active_route",JSON.stringify(activeRouteId));
}
function money(n){return "$"+Number(n||0).toLocaleString("es-AR")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function nav(){
  let a=[
    ["inicio","🏠 Inicio"],
    ["pedidos","🛒 Pedidos"],
    ["ruta","🗺️ Ruta"],
    ["stock","📦 Stock"],
    ["historial","📚 Historial"],
    ["deudas","💳 Deudas"],
    ["copia","💾 Copia"]
  ];
  document.getElementById("nav").innerHTML=a.map(x=>`<button class="${page==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
}
function go(x){page=x;render();scrollTo(0,0)}
function render(){
  nav();
  let m=document.getElementById("main");
  if(page=="inicio")home(m);
  if(page=="pedidos")ordersPage(m);
  if(page=="ruta")routePage(m);
  if(page=="stock")stockPage(m);
  if(page=="historial")historyPage(m);
  if(page=="deudas")debtsPage(m);
  if(page=="copia")backupPage(m);
}

  let p=orders.filter(o=>!o.delivered).length;

    <div class="card">

        <b>📦</b><span>Stock</span>

        <b>📍</b><span>Probar ubicación</span>
      </button>

      <button class="tile" onclick="go('historial')">
        <b>📚</b><span>Historial</span>

      <button class="tile" onclick="go('ruta')">
        <b>🗺️</b><span>Rutas guardadas: ${r}</span>
      </button>

function ordersPage(m){
  let a=[...orders].sort((x,y)=>String(x.name||"").localeCompare(String(y.name||""),"es",{sensitivity:"base"}));

  m.innerHTML=`
    <div class="between">
      <h2>Pedidos</h2>
      <button class="primary" onclick="newOrder()">➕ Nuevo</button>
    </div>

    ${a.length ? a.map(o=>`
      <div class="card order">
        <div class="between">
          <div>

            <div class="muted">📍 ${esc(o.address)}</div>
          </div>
          <b>${money(o.total)}</b>
        </div>

        <div class="muted" style="margin:7px 0">

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
          <span class="badge" style="${o.payment==="Pagado" ? "" : "background:#fff3cd;color:#856404"}">
            💰 ${o.payment==="Pagado" ? "Pagado" : "Pago pendiente"}
          </span>

        </div>

        <div class="actions">

            ${o.payment==="Pagado" ? "↩️ Marcar pendiente" : "💰 Marcar pagado"}
          </button>

          <button
            class="${o.delivered ? "secondary" : "primary"} small"
            onclick="toggleDelivered('${o.id}')">
            ${o.delivered ? "↩️ Marcar pendiente" : "🚚 Marcar entregado"}
          </button>

          <button class="secondary small" onclick="editOrder('${o.id}')">
            ✏️ Editar

          ${o.phone ? `<button class="secondary small" onclick="wa('${o.phone}')">💬 WhatsApp</button>` : ""}

          <button
            class="danger small"

            ✕ Eliminar

function newOrder(){cart=[];editing=null;openOrder()}
function editOrder(id){editing=orders.find(o=>o.id==id);if(!editing)return;cart=editing.items.map(i=>({...i}));openOrder()}
function openOrder(preserved=null){
  const total=cart.reduce((s,i)=>s+i.qty*i.price,0);
  const saved=preserved || {
    'f-name':editing?.name||'',
    'f-address':editing?.address||'',
    'f-phone':editing?.phone||'',
    'f-payment':editing?.payment||'Pendiente',

    'f-address-lng':editing?.lng ?? '',
    'f-address-place-id':editing?.placeId || ''
  };

  document.getElementById('sheet').innerHTML=`
    <h2>${editing?'Editar pedido':'Nuevo pedido'}</h2>
    <label>Nombre *</label>
    <input id="f-name" value="${esc(saved['f-name']||'')}">

    <label>Dirección *</label>
    <div class="address-wrap">
      <input id="f-address" value="${esc(saved['f-address']||'')}" placeholder="Escribí la dirección y elegí una sugerencia de Google Maps" autocomplete="off">
      <div class="actions" style="margin-top:8px">
        <button type="button" class="secondary small" onclick="saveClientFromForm()">💾 Guardar cliente y dirección</button>
        <button type="button" class="secondary small" onclick="showClientPicker()">👤 Añadir cliente</button>
      </div>
      <input id="f-address-lat" type="hidden" value="${esc(saved['f-address-lat']||'')}">
      <input id="f-address-lng" type="hidden" value="${esc(saved['f-address-lng']||'')}">
      <input id="f-address-place-id" type="hidden" value="${esc(saved['f-address-place-id']||'')}">
      <div id="address-status" class="address-status"></div>
    </div>

    <label>Teléfono</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="f-phone" value="${esc(saved['f-phone']||'')}" style="flex:1">
      <button type="button" id="btnPickContact" class="secondary small"
        onclick="pickClientContact()"
        style="white-space:nowrap"
        title="Elegir un contacto de la agenda">
        📱 Agenda
      </button>
    </div>

    <label>Pago</label>
    <select id="f-payment"><option ${saved['f-payment']!='Pagado'?'selected':''}>Pendiente</option><option ${saved['f-payment']=='Pagado'?'selected':''}>Pagado</option></select>

    <h3>Productos</h3>
    ${PRODUCTS.map(p=>{let q=cart.find(i=>i.id==p[2])?.qty||0;return `<div class="product"><div><b>${p[0]}</b><div class="muted">${money(p[1])}</div></div><div class="qty"><button type="button" onclick="changeCart('${p[2]}',-1)">−</button><b>${q}</b><button type="button" onclick="changeCart('${p[2]}',1)">+</button></div></div>`}).join('')}
    <div class="total">Total: ${money(total)}</div>
    <div class="actions"><button type="button" class="primary" onclick="saveOrder()">💾 Guardar pedido</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div>`;

  document.getElementById('modal').classList.add('open');
  setupAddressAutocomplete(
    saved['f-address']||'',
    saved['f-address-lat']!==''?Number(saved['f-address-lat']):null,
    saved['f-address-lng']!==''?Number(saved['f-address-lng']):null,
    saved['f-address-place-id']||''
  );
}

function currentClientFromForm(){
  const name=document.getElementById('f-name')?.value.trim()||'';
  const addressEl=document.getElementById('f-address');
  const address=addressEl?.value.trim()||'';
  const phone=document.getElementById('f-phone')?.value.trim()||'';
  const lat=document.getElementById('f-address-lat')?.value||addressEl?.dataset.lat||'';
  const lng=document.getElementById('f-address-lng')?.value||addressEl?.dataset.lng||'';
  const placeId=document.getElementById('f-address-place-id')?.value||addressEl?.dataset.placeId||'';
  return {
    id:'', name, address, phone,
    lat:lat!==''?Number(lat):null,
    lng:lng!==''?Number(lng):null,
    placeId
  };
}

function saveClientFromForm(){
  const c=currentClientFromForm();
  if(!c.name||!c.address){
    alert('Completá primero el nombre y la dirección del cliente.');
    return;
  }

  const existing=clients.find(x=>
    String(x.name||'').trim().toLowerCase()===c.name.toLowerCase()
  );

  if(existing){
    if(!confirm(`Ya existe un cliente llamado "${existing.name}". ¿Querés actualizar sus datos?`)) return;
    existing.address=c.address;
    existing.phone=c.phone;
    existing.lat=c.lat;
    existing.lng=c.lng;
    existing.placeId=c.placeId;
  }else{
    clients.push({...c,id:'c'+Date.now().toString()});
  }

  clients.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'}));
  save();
  alert(existing?'Cliente actualizado correctamente.':'Cliente guardado correctamente.');
}

function showClientPicker(){
  if(!clients.length){
    alert('Todavía no hay clientes guardados. Primero guardá un cliente y su dirección.');
    return;
  }

  const ordered=[...clients].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'}));

  document.getElementById('sheet').innerHTML=`
    <h2>👤 Añadir cliente</h2>
    <div class="muted" style="margin-bottom:12px">Elegí un cliente para completar automáticamente sus datos.</div>
    <input id="client-search" placeholder="🔎 Buscar cliente..." oninput="filterClientPicker()">
    <div id="client-picker-list" style="margin-top:10px">
      ${ordered.map(c=>clientPickerRow(c)).join('')}
    </div>
    <div class="actions" style="margin-top:14px">
      <button type="button" class="secondary" onclick="openOrder()">Cancelar</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}

function clientPickerRow(c){
  return `<button type="button" class="secondary" style="display:block;width:100%;text-align:left;margin-bottom:8px" onclick="selectClient('${esc(c.id)}')">
    <b>${esc(c.name)}</b><br>
    <span class="muted">📍 ${esc(c.address||'Sin dirección')}</span>${c.phone?`<br><span class="muted">📞 ${esc(c.phone)}</span>`:''}
  </button>`;
}

function filterClientPicker(){
  const q=(document.getElementById('client-search')?.value||'').trim().toLowerCase();
  const list=document.getElementById('client-picker-list');
  if(!list)return;
  const filtered=[...clients]
    .filter(c=>String(c.name||'').toLowerCase().includes(q) || String(c.address||'').toLowerCase().includes(q))
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'}));
  list.innerHTML=filtered.length?filtered.map(clientPickerRow).join(''):`<div class="empty">No encontré ese cliente.</div>`;
}

function selectClient(id){
  const c=clients.find(x=>x.id==id);
  if(!c)return;

  // Si venimos del selector, volvemos a construir el pedido conservando los productos ya elegidos.
  const preserved=preserveOrderForm();
  preserved['f-name']=c.name||'';
  preserved['f-address']=c.address||'';
  preserved['f-phone']=c.phone||'';
  preserved['f-address-lat']=c.lat!=null?c.lat:'';
  preserved['f-address-lng']=c.lng!=null?c.lng:'';
  preserved['f-address-place-id']=c.placeId||'';
  closeModal();
  openOrder(preserved);
}

function changeCart(id,d){
  const form=preserveOrderForm();
  const p=PRODUCTS.find(x=>x[2]==id),i=cart.findIndex(x=>x.id==id);
  if(i<0&&d>0)cart.push({id:p[2],name:p[0],price:p[1],qty:1});
  else if(i>=0){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1)}
  openOrder(form);
}

function saveOrder(){
  const name=document.getElementById('f-name')?.value.trim()||'';
  const addressEl=document.getElementById('f-address');
  const address=addressEl?.value.trim()||'';

  if(!name||!address||!cart.length){
    alert('Completá nombre, dirección y al menos un producto.');
    return;
  }

  const lat=document.getElementById('f-address-lat')?.value||addressEl?.dataset.lat||'';
  const lng=document.getElementById('f-address-lng')?.value||addressEl?.dataset.lng||'';
  const placeId=document.getElementById('f-address-place-id')?.value||addressEl?.dataset.placeId||'';

  const wasEditing=!!editing;

  const o={
    id:editing?.id||Date.now().toString(),
    name,
    address,
    phone:document.getElementById('f-phone')?.value.trim()||'',
    payment:document.getElementById('f-payment')?.value||'Pendiente',
    lat:lat!==''?Number(lat):null,
    lng:lng!==''?Number(lng):null,
    placeId,
    items:cart.map(i=>({...i})),
    total:cart.reduce((s,i)=>s+i.qty*i.price,0),
    delivered:editing?.delivered||false
  };

  if(wasEditing){
    orders[orders.findIndex(x=>x.id==editing.id)]=o;
  }else{
    orders.push(o);
  }

  save();

  if(wasEditing){
    closeModal();
    go('pedidos');
    return;
  }

  cart=[];
  editing=null;
  openOrder();
}

function togglePaid(id){
  const o=orders.find(x=>x.id==id);
  if(!o)return;

  o.payment=o.payment==="Pagado" ? "Pendiente" : "Pagado";

  save();
  render();
}

function toggleDelivered(id){
  const o=orders.find(x=>x.id==id);
  if(!o)return;

  o.delivered=!o.delivered;

  save();
  render();
}

function deleteOrder(id){
  const o=orders.find(x=>x.id==id);
  if(!o)return;

  if(!confirm(`¿Deseás eliminar el pedido de ${o.name}?`)) return;

  orders=orders.filter(x=>x.id!==id);

  // También lo quitamos de las rutas guardadas para evitar paradas fantasma.
  routeTemplates.forEach(r=>{
    r.stops=(r.stops||[]).filter(s=>{
      if(s.orderId) return s.orderId!==id;
      return !(String(s.name||"").toLowerCase()===String(o.name||"").toLowerCase() &&
               String(s.address||"").toLowerCase()===String(o.address||"").toLowerCase());
    });
    if(r.optimizedOrderIds) {
      r.optimizedOrderIds=r.optimizedOrderIds.filter(x=>x!==id);
    }
  });

  save();
  render();
}

async function setupRouteAutocomplete(inputId,statusId,existingValue=""){
  const input=document.getElementById(inputId);
  const status=document.getElementById(statusId);
  if(!input||!status)return;

  input.dataset.lat="";
  input.dataset.lng="";
  input.value=existingValue||"";

  const ready=await loadGooglePlaces();

  if(!ready){
    status.className="address-status address-warn";
    status.textContent="Google Maps no pudo cargarse. Podés escribir la dirección manualmente.";
    return;
  }

  try{
    const autocomplete=new google.maps.places.Autocomplete(input,{
      componentRestrictions:{country:"ar"},
      fields:["formatted_address","geometry","place_id","name"]
    });

    autocomplete.addListener("place_changed",()=>{
      const place=autocomplete.getPlace();

      if(place?.formatted_address){
        input.value=place.formatted_address;
        input.dataset.lat=place.geometry?.location?.lat?.() ?? "";
        input.dataset.lng=place.geometry?.location?.lng?.() ?? "";
        input.dataset.placeId=place.place_id||"";
        status.className="address-status address-ok";
        status.textContent="📍 Punto confirmado por Google Maps.";
      }
    });

    status.className="address-status address-warn";
    status.textContent=existingValue
      ? "Podés modificar el punto y elegir una sugerencia."
      : "Escribí y elegí una sugerencia de Google Maps.";
  }catch(e){
    status.className="address-status address-warn";
    status.textContent="Podés escribir la dirección manualmente.";
  }
}

async function optimizeActiveRoute(){
  const route=routeTemplates.find(r=>r.id===activeRouteId);
  if(!route){
    alert("Primero cargá una ruta.");
    return;
  }

  const pending=orders.filter(o=>!o.delivered);

  let routeOrders=pending.filter(o=>
    (route.stops||[]).some(s=>
      (s.orderId && s.orderId===o.id) ||
      (s.placeId && o.placeId && s.placeId===o.placeId) ||
      (!s.orderId && String(s.name||"").toLowerCase()===String(o.name||"").toLowerCase() &&
       String(s.address||"").toLowerCase()===String(o.address||"").toLowerCase())
    )
  );

  if(!routeOrders.length){
    alert("No hay pedidos pendientes en esta ruta.");
    return;
  }

  const origin=document.getElementById("route-origin")?.value.trim()||route.origin||"";
  const destination=document.getElementById("route-destination")?.value.trim()||route.destination||"";

  if(!origin||!destination){
    alert("Completá la dirección inicial y el punto de llegada antes de optimizar.");
    return;
  }

  if(routeOrders.length===1){
    route.origin=origin;
    route.destination=destination;
    route.optimizedOrderIds=[routeOrders[0].id];
    save();
    render();
    alert("Hay una sola parada: la ruta quedó lista.");
    return;
  }

  const ready=await loadGooglePlaces();

  if(!ready || !window.google?.maps?.DirectionsService){
    alert("Google Maps no está disponible para optimizar la ruta.");
    return;
  }

  try{
    const service=new google.maps.DirectionsService();

    const waypoints=routeOrders.map(o=>({
      location:o.lat!=null && o.lng!=null
        ? {lat:Number(o.lat),lng:Number(o.lng)}
        : o.address,
      stopover:true
    }));

    const result=await new Promise((resolve,reject)=>{
      service.route({
        origin,
        destination,
        waypoints,
        optimizeWaypoints:true,
        travelMode:google.maps.TravelMode.DRIVING
      },(response,status)=>{
        if(status==="OK") resolve(response);
        else reject(new Error(status||"No se pudo calcular la ruta."));
      });
    });

    const order=result.routes?.[0]?.waypoint_order;

    if(!Array.isArray(order) || order.length!==routeOrders.length){
      throw new Error("Google Maps no devolvió un orden optimizado.");
    }

    const optimized=order.map(i=>routeOrders[i]).filter(Boolean);

    route.origin=origin;
    route.destination=destination;
    route.optimizedOrderIds=optimized.map(o=>o.id);
    route.optimizedAt=new Date().toISOString();

    save();
    render();

    alert(`Ruta optimizada correctamente: ${optimized.length} paradas.`);
  }catch(error){
    console.error("Optimización:",error);
    alert("No se pudo optimizar la ruta. Revisá las direcciones inicial y final y que los pedidos tengan ubicaciones válidas.");
  }
}

function confirmSaveRoute(){
    let name = document.getElementById("route-name-input").value.trim();

    let selectedIds = [
        ...document.querySelectorAll(".route-order-check:checked")
    ].map(x => x.value);

    if(!name){
        alert("Ingresá un nombre para la ruta.");
        return;
    }

    if(!selectedIds.length){
        alert("Seleccioná al menos un pedido.");
        return;
    }

    let selectedOrders = orders.filter(o => selectedIds.includes(o.id));

    let stops = selectedOrders.map(o => ({
        orderId: o.id,
        name: o.name,
        address: o.address,
        phone: o.phone || "",
        lat: o.lat ?? null,
        lng: o.lng ?? null,
        placeId: o.placeId || ""
    }));

    let existing = routeTemplates.find(
        r => r.name.toLowerCase() === name.toLowerCase()
    );

    if(existing){
        if(!confirm(
            `Ya existe la ruta "${existing.name}". ¿Sobreescribirla?`
        )){
            return;
        }

        existing.stops = stops;
        existing.optimizedOrderIds = [];
        activeRouteId = existing.id;

    }else{

        let route = {
            id: "r" + Date.now(),
            name,
            stops,
            origin: "",
            destination: "",
            originLat: "",
            originLng: "",
            destinationLat: "",
            destinationLng: "",
            optimizedOrderIds: []
        };

        routeTemplates.push(route);
        activeRouteId = route.id;
    }

    save();
    closeModal();
    render();

    alert(
        `Ruta "${name}" guardada con ${stops.length} paradas.`
    );
}

function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const raw=String(reader.result||"").replace(/^\\uFEFF/,"").trim();
      let data, recovered=false;
      try{data=JSON.parse(raw);}
      catch(parseError){
        // Algunas copias antiguas terminan con texto duplicado tras un objeto JSON completo.
        // Recuperar únicamente el primer objeto íntegro, nunca datos parciales.
        let depth=0, quoted=false, escaped=false, finish=-1, begun=false;
        for(let i=0;i<raw.length;i++){
          const ch=raw[i];
          if(quoted){
            if(escaped)escaped=false;
            else if(ch==="\\\\")escaped=true;
            else if(ch==='"')quoted=false;
            continue;
          }
          if(ch==='"'){quoted=true;continue;}
          if(ch==="{"||ch==="["){depth++;begun=true;}
          else if(ch==="}"||ch==="]"){
            depth--;
            if(begun&&depth===0){finish=i+1;break;}
            if(depth<0)break;
          }
        }
        if(finish<0)throw new Error("El archivo no contiene un bloque JSON completo. Conservá el original.");
        data=JSON.parse(raw.slice(0,finish));
        recovered=raw.slice(finish).trim().length>0;
      }
      if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Formato de copia inválido");
      // Copias de Manos Verdes Integral guardan cada colección dentro de storage y como texto JSON.
      const source=data.storage&&typeof data.storage==="object"?data.storage:data;
      const readValue=(keys,fallback)=>{
        for(const key of keys){
          if(source[key]!==undefined){
            const value=source[key];
            if(typeof value==="string"){
              try{return JSON.parse(value);}catch(e){throw new Error("La sección "+key+" de la copia está incompleta.");}
            }
            return value;
          }
        }
        return fallback;
      };
      const nextOrders=readValue(["orders","mvi_orders"],[]);
      const nextHistory=readValue(["history","mvi_history"],[]);
      const nextDebts=readValue(["debts","mvi_debts"],[]);
      const nextClients=readValue(["clients","mvi_clients"],[]);
      const nextRoutes=readValue(["routeTemplates","mvi_route_templates"],[]);
      const nextActive=readValue(["activeRouteId","mvi_active_route"],null);
      if(!Array.isArray(nextOrders)||!Array.isArray(nextHistory)||!Array.isArray(nextDebts)||!Array.isArray(nextClients)||!Array.isArray(nextRoutes))throw new Error("La estructura de la copia no coincide con los datos esperados.");
      if(!confirm("Se encontraron "+nextOrders.length+" pedidos, "+nextClients.length+" clientes y "+nextRoutes.length+" rutas. La importación reemplazará los datos actuales de esta instalación. ¿Continuar?"))return;
      orders=nextOrders;history=nextHistory;debts=nextDebts;clients=nextClients;routeTemplates=nextRoutes;activeRouteId=nextActive;
      save();render();
      alert("Copia importada correctamente.\\nPedidos: "+orders.length+"\\nClientes: "+clients.length+"\\nRutas: "+routeTemplates.length+(recovered?"\\n\\nAviso: el archivo tenía texto extra al final. Se recuperó el bloque JSON completo y se ignoró ese texto. Conservá el archivo original.":""));
    }catch(e){alert("No se pudo importar la copia: "+e.message);}
  };
  reader.readAsText(file);
}
function backupPage(m){
  m.innerHTML=`
    <h2>💾 Copia de seguridad</h2>
    <div class="card">
      <p>Podés cargar la copia que ya tenés del reparto para probar esta versión con tus pedidos reales.</p>
      <div class="actions">
        <button type="button" class="primary" onclick="document.getElementById('backup-file').click()">📂 Cargar copia de seguridad</button>
        <button type="button" class="secondary" onclick="exportBackup()">💾 Exportar copia JSON</button>
      </div>
      <input id="backup-file" type="file" accept=".json,application/json,.txt,text/plain" style="display:none" onchange="if(this.files&&this.files[0])importBackup(this.files[0]);this.value=''">
      <p class="muted">La importación reemplaza los datos de esta instalación. Conservá tu copia original y confirmá cuando la aplicación te lo pregunte.</p>
    </div>`;
}
render();
</script>
